<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Blog | Matheus Santos Cardoso</title>
<!-- Fonte moderna via Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
--primary-color: #7c3aed;
--primary-hover: #6d28d9;
--bg-color: #f8fafc;
--card-bg: #ffffff;
--text-color: #1e293b;
--text-muted: #64748b;
--border-radius: 12px;
--box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: 'Inter', sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
line-height: 1.6;
display: flex;
flex-direction: column;
min-height: 100vh;
}

header {
background: linear-gradient(135deg, #8b5cf6, var(--primary-color));
color: white;
padding: 60px 20px;
text-align: center;
box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
}

header h1 {
font-size: 2.5rem;
font-weight: 700;
margin-bottom: 10px;
letter-spacing: -0.5px;
}

header p {
font-size: 1.1rem;
opacity: 0.9;
font-weight: 300;
max-width: 600px;
margin: 0 auto;
}

main {
padding: 40px 20px;
max-width: 800px;
width: 100%;
margin: 0 auto;
flex: 1;
display: flex;
flex-direction: column;
gap: 24px;
}

article {
background-color: var(--card-bg);
border-radius: var(--border-radius);
padding: 32px;
box-shadow: var(--box-shadow);
border: 1px solid #e2e8f0;
transition: transform 0.2s ease, box-shadow 0.2s ease;
}

article:hover {
transform: translateY(-2px);
box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
}

article h2 {
font-size: 1.75rem;
color: var(--text-color);
margin-bottom: 12px;
}

.author-tag {
display: inline-block;
font-size: 0.9rem;
color: var(--text-muted);
margin-bottom: 20px;
padding-bottom: 12px;
border-bottom: 1px solid #f1f5f9;
width: 100%;
}

.author-tag strong {
color: var(--primary-color);
}

article p {
font-size: 1.05rem;
color: #334155;
margin-bottom: 12px;
}

article ul, article ol {
margin-left: 20px;
margin-bottom: 16px;
color: #334155;
}

article li {
margin-bottom: 8px;
}

article code {
background-color: #f1f5f9;
color: var(--primary-color);
padding: 2px 6px;
border-radius: 4px;
font-size: 0.9rem;
}

footer {
text-align: center;
padding: 20px;
font-size: 0.9rem;
color: var(--text-muted);
border-top: 1px solid #e2e8f0;
margin-top: auto;
}
</style>
</head>
<body>

<header>
<h1>💻 Matheus Santos Cardoso</h1>
<p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
</header>

<main>
<!-- Artigo: Postagem Inicial -->
<article>
<h2>Meu primeiro post</h2>
<div class="author-tag">
<span>Por: <strong>Matheus Santos Cardoso</strong></span>
</div>
<p>Boas-vindas ao meu primeiro blog!</p>
</article>
